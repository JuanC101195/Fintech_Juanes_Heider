        matriculaRunt:
          type: string
        meses:
          type: integer
          format: int32
        pagoInicial:
          type: string
        perfilReglas:
          type: string
        periodicidad:
          type: string
        plazoLimitePeriodos:
          type: integer
          format: int32
        prenda:
          type: string
        primerVencimiento:
          type: string
        soat:
          type: string
        valorMoto:
          type: string
    DeudaDto:
