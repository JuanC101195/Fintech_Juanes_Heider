openapi: 3.1.0
info:
  description: |-
    Motor de reglas de cartera de la financiera: simula créditos de moto (cuotas semanales, quincenales o mensuales), ejecuta escenarios de pagos (pagos tarde, parciales, abonos, prepagos, cambios de tasa, dación y retoma) y clasifica un pago en el caso de negocio que le corresponde.

    **Autenticación.** Cada petición a `/api/v1/**` lleva la cabecera `X-API-Key` con la clave que entrega la financiera. Sin clave válida responde 401; con una clave de solo lectura, los POST responden 403.

    **Dinero y tasas.** Viajan como texto decimal sin redondear (por ejemplo `"5904400"` o `"0.8762"`), para no perder precisión. Las fechas van en formato `yyyy-MM-dd`.

    **Perfiles de reglas.** `perfilReglas` = `NEGOCIO` (las reglas vigentes de la financiera, el valor por defecto en simulaciones y escenarios) o `EXCEL` (reproduce el Excel de casos tal cual).

    **Errores.** Todos responden `{codigo, mensaje, detalle}` con un código estable: 400 `VALIDACION` (dato inválido; `detalle.campo` dice cuál), `PLAZO_MAXIMO`, `ABONO_MAYOR_QUE_SALDO` y `LOTE_DEMASIADO_GRANDE`; 401 `NO_AUTORIZADO`; 403 `PROHIBIDO`; 404 `CASO_INEXISTENTE`; 413 `CUERPO_DEMASIADO_GRANDE`; 500 `ASIENTO_DESCUADRADO` o `ERROR_INTERNO`.

    **Disponibilidad.** El servicio corre en un plan gratuito: si estuvo inactivo, la primera petición puede tardar unos 30 segundos.
  title: API del motor de cartera
  version: 1.0.0
servers:
- description: Azure App Service
  url: https://motor-cartera-api-jc.azurewebsites.net
security:
- claveApi: []
tags:
- description: "Simulación de créditos, escenarios de pago y clasificación de pagos"
  name: Motor de cartera
paths:
  /api/v1/casos:
    get:
      description: Los 13 casos de referencia (los 12 del Excel de casos y el abono
        extra con pendientes).
      operationId: casos
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasoResumenDto"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Casos de negocio
      tags:
      - Motor de cartera
  /api/v1/casos/{numero}:
    get:
      description: "Devuelve el caso con su resultado calculado: con las reglas EXCEL\
        \ (por defecto) o NEGOCIO; con fechaDesembolso y primerVencimiento, con la\
        \ primera cuota prorrateada."
      operationId: caso
      parameters:
      - description: "Número del caso, de 1 a 13"
        in: path
        name: numero
        required: true
        schema:
          type: integer
          format: int32
      - description: EXCEL (por defecto) o NEGOCIO
        in: query
        name: perfilReglas
        required: false
        schema:
          type: string
      - in: query
        name: fechaDesembolso
        required: false
        schema:
          type: string
      - in: query
        name: primerVencimiento
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: No existe el caso (CASO_INEXISTENTE)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Consultar un caso de referencia
      tags:
      - Motor de cartera
  /api/v1/catalogo:
    get:
      description: "Líneas de crédito con su tasa y plazo, periodicidades, perfiles\
        \ de reglas, tipos de instrucción de pago y las claves de reglas de negocio."
      operationId: catalogo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogoResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Catálogo del producto
      tags:
      - Motor de cartera
  /api/v1/clasificaciones:
    post:
      description: "Recibe un pago y devuelve su clasificación: en qué caso de negocio\
        \ cae (al día, tarde, parcial, abono, prepago...) según lo exigible del cré\
        dito en ese periodo."
      operationId: clasificar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClasificarRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClasificacionResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: La clave es de solo lectura (PROHIBIDO)
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: El cuerpo supera el tamaño máximo (CUERPO_DEMASIADO_GRANDE)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Clasificar un pago
      tags:
      - Motor de cartera
  /api/v1/escenarios:
    post:
      description: "Recibe un crédito con instrucciones por periodo (pago tarde, parcial,\
        \ por valor, sin pago, abono extra, prepago, cambio de tasa, usura, dació\
        n o retoma) y devuelve cada periodo con su causación, el reparto del pago\
        \ por prelación, los saldos y los asientos contables. No guarda nada: cada\
        \ petición trae el historial completo del crédito."
      operationId: ejecutar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EjecutarRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EjecucionResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: La clave es de solo lectura (PROHIBIDO)
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: El cuerpo supera el tamaño máximo (CUERPO_DEMASIADO_GRANDE)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Evaluar un escenario de pagos
      tags:
      - Motor de cartera
  /api/v1/escenarios/lotes:
    post:
      description: "Hasta 500 escenarios en una petición. Responde NDJSON (application/x-ndjson):\
        \ una línea por escenario, en orden, con el mismo resultado de POST /escenarios\
        \ o {indice, codigo, mensaje, detalle} si ese escenario falla."
      operationId: ejecutarLote
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EjecutarRequest"
        required: true
      responses:
        "200":
          content:
            application/x-ndjson: {}
          description: Una línea JSON por escenario
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: La clave es de solo lectura (PROHIBIDO)
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: El cuerpo supera el tamaño máximo (CUERPO_DEMASIADO_GRANDE)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Evaluar un lote de escenarios
      tags:
      - Motor de cartera
  /api/v1/reglas:
    get:
      description: "Los perfiles EXCEL y NEGOCIO con el valor de cada regla, su descripció\
        n y la pregunta o decisión de donde sale."
      operationId: reglas
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReglasResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Reglas de negocio vigentes
      tags:
      - Motor de cartera
  /api/v1/simulaciones:
    post:
      description: "Calcula la cuota, los servicios y el plan de pagos completo de\
        \ un crédito nuevo, pagado al día. Con fechaDesembolso y primerVencimiento\
        \ (juntas) la primera cuota se prorratea por los días reales."
      operationId: simular
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulacionResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Dato inválido o regla del crédito (VALIDACION, PLAZO_MAXIMO,\
            \ ABONO_MAYOR_QUE_SALDO, LOTE_DEMASIADO_GRANDE)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Falta una clave válida en X-API-Key (NO_AUTORIZADO)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: La clave es de solo lectura (PROHIBIDO)
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: El cuerpo supera el tamaño máximo (CUERPO_DEMASIADO_GRANDE)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: "Error interno (ASIENTO_DESCUADRADO, ERROR_INTERNO)"
      summary: Simular un crédito
      tags:
      - Motor de cartera
components:
  schemas:
    AsientoDto:
      type: object
      properties:
        cuadra:
          type: boolean
        evento:
          type: string
        lineas:
          type: array
          items:
            $ref: "#/components/schemas/LineaAsientoDto"
        periodo:
          type: integer
          format: int32
        totalCreditos:
          type: string
        totalDebitos:
          type: string
    CasoResponse:
      type: object
      properties:
        asientos:
          type: array
          items:
            $ref: "#/components/schemas/AsientoDto"
        caso:
          $ref: "#/components/schemas/CasoResumenDto"
        credito:
          $ref: "#/components/schemas/CreditoRequest"
        instrucciones:
          type: array
          items:
            $ref: "#/components/schemas/InstruccionDto"
        movimientos:
          type: array
          items:
            $ref: "#/components/schemas/MovimientoDto"
        perfilReglas:
          type: string
        resumen:
          $ref: "#/components/schemas/ResumenEjecucion"
    CasoResumenDto:
      type: object
      properties:
        descripcion:
          type: string
        fuente:
          type: string
        nombre:
          type: string
        numero:
          type: integer
          format: int32
    CatalogoResponse:
      type: object
      properties:
        lineas:
          type: array
          items:
            $ref: "#/components/schemas/LineaDto"
        modalidadesAbono:
          type: array
          items:
            type: string
        modalidadesCambioTasa:
          type: array
          items:
            type: string
        perfilesReglas:
          type: array
          items:
            type: string
        periodicidades:
          type: array
          items:
            $ref: "#/components/schemas/PeriodicidadDto"
        tiposInstruccion:
          type: array
          items:
            type: string
        tiposRecuperacion:
