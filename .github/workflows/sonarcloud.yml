name: Pruebas y SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  analisis:
    name: Pruebas y análisis
    runs-on: ubuntu-latest
    steps:
      - name: Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: Sonar lo usa para detectar el código nuevo

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cuestionario/package-lock.json

      - name: Pruebas del cuestionario
        working-directory: cuestionario
        run: |
          npm ci
          npx vitest run --coverage

      - name: Caché de Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Pruebas del motor, cobertura y análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: chmod +x mvnw && ./mvnw -B --no-transfer-progress verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
