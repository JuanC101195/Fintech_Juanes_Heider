name: Pruebas

# SonarCloud analiza cada push y cada PR por su cuenta (análisis automático, configurado en
# .sonarcloud.properties). Este flujo corre las pruebas del motor y del cuestionario.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas del motor y del cuestionario
    runs-on: ubuntu-latest
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cuestionario/package-lock.json

      - name: Pruebas del motor con cobertura
        run: chmod +x mvnw && ./mvnw -B --no-transfer-progress verify

      - name: Pruebas del cuestionario con cobertura
        working-directory: cuestionario
        run: |
          npm ci
          npx vitest run --coverage
