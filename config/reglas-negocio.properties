# Reglas de negocio respondidas por Diego (documento Preguntas-PO-Financiera, 2026-10-16).
# Se escribió a mano a partir de docs/respuestas-diego-2026-10-16.md; el importador del
# cuestionario (herramientas/importar_respuestas.py) lo sobrescribe si se usa.
# Lo que no aparece queda como en el Excel (ReglasNegocio.EXCEL).

# P-03: el capital vencido paga solo mora; el interés corriente va sobre el capital vigente.
baseInteres=SALDO_VIGENTE
# P-07: fondo de garantías y seguro sobre el monto financiado inicial.
baseServicios=MONTO_INICIAL
# P-16: en dación y retoma se causan mora y servicios en las semanas sin pago.
moraAntesDeRecuperacion=true
