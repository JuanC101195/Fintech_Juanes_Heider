# Reglas de negocio respondidas por Diego (documento Preguntas-PO-Financiera, 2026-10-16).
# Se escribió a mano a partir de docs/respuestas-diego-2026-10-16.md; el importador del
# cuestionario (herramientas/importar_respuestas.py) lo sobrescribe si se usa.
# Lo que no aparece queda como en el Excel (ReglasNegocio.EXCEL).

# P-03: el capital vencido paga solo mora; el interés corriente va sobre el capital vigente.
baseInteres=SALDO_VIGENTE
# P-07: fondo de garantías y seguro sobre el monto financiado inicial.
baseServicios=MONTO_INICIAL
# P-16: en dación y retoma se causan mora y servicios en las semanas sin pago.
moraAntesDeRecuperacion=true

# Respuestas de Diego del 2026-10-20 (escritas a mano; el importador aún no conoce estas claves).
# A4: el abono extra o el prepago paga primero los pendientes por prelación y el resto va a capital.
# R4-CASO13 (ronda 4, 2026-10-21): el excedente después de lo vencido vuelve a pasar por la prelación sobre
# lo causado del periodo corriente (su fondo y su asistencia si no se pagó al día); solo el resto va a capital.
aplicacionAbono=PRELACION_COMPLETA
# A6: el prepago total cobra el interés corriente de los días desde la última cuota.
interesPrepagoPorDias=true
# T2: margen bajo la usura, en puntos porcentuales de EA (1 = 100 pb).
margenUsura=1

# Ronda 3 de Diego (2026-10-20 en la tarde; escrita a mano, el importador aún no conoce esta clave).
# USU-6: cuando la usura obliga a bajar la tasa se mantiene la cuota y baja el plazo (caso 10).
modalidadUsura=MISMA_CUOTA

# Ronda 4 de Diego (2026-10-21; escrita a mano, el importador aún no conoce estas claves).
# R4-R2: en la dación el costo real de la recuperación se suma al faltante que cubre el fondo de garantías.
# Confirmado por Diego en la ronda 5 (P5-COSTO-DACION).
costoRecuperacionAlFondo=true
# R4-COBRANZA-CONTABLE: los gastos de cobranza son ingreso no operacional (PUC clase 42).
cobranzaIngresoNoOperacional=true
# R4-PLAZO-LIMITE: plazo límite de recuperación de 24 meses, en periodos del crédito (104 / 48 / 24).
# R6-LIMITE-CORTO: el límite es min(plazo propio del crédito, 24 meses): un crédito de 12 meses tiene límite 12.
# Solo para créditos nuevos y simulaciones del API; los casos 8 y 9 conservan sus 100 y 120 semanas.
plazoLimiteMeses=24

# Documento "rptas software" de Diego (2026-10-22; escrito a mano).
# R4-T5: si cambia la tasa con el cliente en mora, la cuota nueva va solo sobre el capital vigente; lo vencido se
# cobra aparte y no se capitalizan intereses (en Colombia está prohibido liquidar intereses sobre intereses).
cambioTasaSobreCapitalVigente=true
# COB-6: valor diario de la cobranza para créditos nuevos. PROVISIONAL: los 3.000 son solo un ejemplo; el valor
# real lo define el director financiero (R10-VALOR-COBRANZA, D65, 2026-10-31) con vigencias en el tiempo (cada
# crédito guarda el vigente cuando se origina).
cobranzaDiaria=3000
# PPER-9: con 2 cuotas atrasadas (en periodos de la periodicidad) el crédito queda "listo para recuperación".
# R6-RECUP-AUTO: el motor solo marca, nunca ejecuta; una persona decide. La marca persiste aunque el cliente se
# ponga al día (hasta que el crédito termina).
cuotasVencidasParaRecuperacion=2
# R7-COBRANZA-ACTIVA (Diego 2026-10-27): la cobranza empieza sola tras 2 periodos en mora (tercera cuota vencida),
# en periodos de la periodicidad pactada; el director financiero puede exonerar. El valor diario sigue siendo
# PROVISIONAL (cobranzaDiaria); la política real de cobranza se pule después y no frena el resto del motor.
# R10-CONTADOR-VENCIDAS (Diego 2026-10-31, D71): mientras rija umbralCocienteCobranza (abajo) esta clave NO decide la
# cobranza; se deja para documentar las rondas 7 a 9.
cuotasVencidasParaCobranza=2

# Ronda 5 de Diego (escrita a mano).
# P5-PRORRATEO: la primera cuota se prorratea entre el desembolso y la primera fecha de pago (semanal primer martes,
# quincenal 5 o 20, mensual día 5). Solo el interés, por los días reales; capital y servicios van completos.
# Requiere que el escenario traiga las fechas (Escenario.conCalendario); sin fechas no cambia nada.
prorrateoPrimeraCuota=true

# ADR 0002 paso 8 (escrito a mano). PPER-5 / D27: en mensual la mora cuenta los días reales del mes (28 a 31) en vez
# de la tasa mensual. Solo con fechas en el escenario (Escenario.conCalendario); quincenal y semanal siguen nominales
# porque Diego solo decidió la mensual.
diasMora=DIAS_CALENDARIO_MENSUAL

# Ronda 8 de Diego (2026-10-28; escrita a mano).
# R8-COBRANZA-PAGO-TARDIO: la cobranza NO se prorratea por días; es un cobro único y fijo por periodo. Con el umbral de
# R7 (cuotasVencidasParaCobranza=2), cada periodo en mora que causaría cobranza causa exactamente este valor, una vez,
# y se repite en cada periodo atrasado hasta que el crédito cierra (dación, retoma o pago). Un pago completo pero
# tardío sin llegar al umbral no genera cobranza (caso 9). PROVISIONAL: los 40.000 son el ejemplo de Diego. El momento
# exacto del primer cobro sigue abierto (R9-COBRO-MOMENTO).
cobranzaPorPeriodo=40000
# R8-PAGO-INCOMPLETO-EN-FECHA (H7): la causación genera siempre fondo + asistencia + seguro (más interés y capital),
# haya o no pago en la fecha. La suspensión de fondo y asistencia tras 2 periodos atrasados
# (cuotasVencidasParaSuspenderServicios=2) quedó REEMPLAZADA por R10-CONTADOR-VENCIDAS (D70, causacionServicios=SIEMPRE,
# abajo): ya no se suspenden por atraso. La clave solo se usa con causacionServicios=SUSPENDER_POR_UMBRAL.
# R8-REDONDEO-PESO (H2): la cuota exigible se redondea a pesos enteros (HALF_UP, supuesto); el residuo (hasta medio
# peso) se absorbe en el interés corriente del periodo, así el plan de capital y los servicios de terceros no cambian.
redondeoCuotaAlPeso=true
# R8-PAGO-MAYOR-EXIGIBLE (H8): un pago mayor que lo exigible se recibe completo y el sobrante queda como cuenta por
# pagar al cliente para devolverlo (cuenta provisional CXP_SOBRANTE_CLIENTE, PUC pendiente).
sobranteComoCuentaPorPagar=true

# Ronda 9 de Diego (2026-10-30; escrita a mano).
# R9-COBRO-MOMENTO = segunda-cuota (lectura A): el cliente deja de pagar desde la semana 1; al terminar la semana 2 ya tiene
# 2 cuotas atrasadas y ahí se cobran los 40.000 y se suspenden fondo y asistencia; en la semana 3 otros 40.000, y así cada
# periodo atrasado. Con true, cuotasVencidasParaCobranza y cuotasVencidasParaSuspenderServicios (los dos en 2) cuentan
# también la cuota del periodo en curso si queda atrasada (SinPago, PagoParcial o PagoValor menor que la cuota total
# pactada). Antes (lectura B) solo contaban las de periodos anteriores: se cobraba desde la 3.ª. Ver docs/adr/0005.
# REEMPLAZADA por R10-CONTADOR-VENCIDAS (D71, umbralCocienteCobranza, abajo; ADR 0006): umbralesCuentanCuotaEnCurso ya no
# se fija en NEGOCIO (queda en false, como el Excel) y solo la usan las pruebas de la ronda 9.
# R9-SEGURO-TODO-RIESGO = seguro-nuevo-se-suma: seguro todo riesgo NUEVO que se suma al seguro de vida. "Inicialmente
# pactemos como un porcentaje mensual sobre financiación inicial del 0,3% y se paga igual que el de vida, pero se debe
# sumar el 19% de IVA" (si el seguro da 10.000, al cliente se le cobran 11.900). R12-IVA-FONDO-ASISTENCIAS y
# R12-CUENTA-TERCEROS (Diego 2026-11-01, D78, supera a D69): en la contabilidad ya NO se segmentan el seguro y su IVA; van
# en un gran total como cuenta por pagar, igual que el fondo y las asistencias. Periodizado como el seguro de vida (valor mensual × 12 / ppa). PROVISIONAL: tras la suspensión de fondo
# y asistencia sigue causándose con el seguro de vida (Diego dijo "solo se causa el seguro" sin precisar cuál; ronda 11).
seguroTodoRiesgoPorcentajeMensual=0.003
# R9-SERVICIOS-AL-PONERSE-AL-DIA = se-pierden: al ponerse al día tras la suspensión, el fondo y la asistencia de los
# periodos suspendidos NO se cobran después; se retoman desde el periodo siguiente. Es lo que ya hace el motor con
# cuotasVencidasParaSuspenderServicios (lo suspendido nunca se causa ni lo revive un abono); no necesita clave nueva.

# Rondas 10 y 11 de Diego (2026-10-31; escrita a mano). R10-CONTADOR-VENCIDAS y R11-SEGUROS-TRAS-SUSPENSION (D70 a D72,
# ADR 0006, reemplaza la 0005).
# (1) El cliente siempre paga los servicios (fondo + asistencia + seguros) en la cuota, esté al día o atrasado: no hay
# suspensión por atraso y los dos seguros se causan siempre. (4) En retoma o dación se suspenden por completo los servicios
# (cierra el crédito): el periodo del cierre no causa servicios.
causacionServicios=SIEMPRE
# (3) La cobranza se ejecuta cuando saldo total en mora / valor total de la cuota > 2; con abonos parciales que no llegan a
# 2 cuotas NO hay cobranza pero SÍ interés de mora. Valor: cobranzaPorPeriodo (40.000, D58). Denominador: cuota financiera
# vigente + servicios por cuota (al peso). Se evalúa al iniciar cada periodo con los saldos del cierre del anterior.
umbralCocienteCobranza=2
# R12-COBRANZA-SALDO-MORA (Diego 2026-11-01, D74): el saldo en mora es la totalidad de lo pendiente (capital vencido +
# interés corriente + servicios + mora + cobranza) y la cobranza aplica desde IGUAL o MAYOR a 2 (antes, supuesto: > 2).
baseMoraCobranza=TOTAL_PENDIENTE
comparacionCobranza=MAYOR_O_IGUAL

# Ronda 12 de Diego (2026-11-01; escrita a mano).
# R12-SERVICIOS-DESPUES-PLAZO = mientras-haya-deuda (D76): los servicios siguen causándose después de la última cuota
# pactada mientras el crédito tenga saldo de capital. El periodo de una dación o una retoma sigue sin causarlos.
serviciosDespuesDelPlazo=true
# R12-MARCA-POR-COCIENTE = por-cociente (D77): la marca "listo para recuperación" se mide con el mismo cociente de la
# cobranza (saldo en mora / cuota total >= 2) al cerrar cada periodo; ya no cuenta cuotas vencidas por eventos
# (cuotasVencidasParaRecuperacion queda solo como documentación). La marca persiste aunque el cociente baje (D67); la
# cobranza solo se cobra mientras el cociente siga >= 2. Ronda 13 (D85, R13-COBRANZA-TRAS-MARCA): la marca ya NO persiste con
# la marca por cociente: se desactiva cuando el saldo en mora baja de 2 cuotas, y entonces tampoco hay cobranza.
marcaPorCociente=true
# R10-PRIMERA-CUOTA = proporcional-dias + R12-PRIMERA-CUOTA-DETALLE = se-pierden (D79): la primera cuota completa se
# prorratea por los días (interés por días reales; capital y servicios por días reales / días nominales). El capital no
# cobrado sigue en el saldo y lo recoge la última cuota (la cuota fija no cambia); los servicios no cobrados se pierden.
# Ronda 13 de Diego (2026-11-02; D84): R13-PRIMERA-CUOTA-INTERES = sin-interes (el capital no cobrado de la primera cuota NO
# causa interés y la última cuota solo suma ese capital) y R13-PRIMERA-CUOTA-LARGA = no-se-permite (el primer vencimiento
# siempre cae dentro del primer periodo: el motor rechaza un desembolso a más de un periodo del primer vencimiento).
alcanceProrrateoPrimeraCuota=CUOTA_COMPLETA_SIN_INTERES

# Instrucciones nuevas de Diego (2026-11-05, sesión de la ronda 14; escritas a mano). ADR 0009, D88 y D89. Versión de
# reglas negocio-2026-11-06.
# D88 · COBRANZA TEMPORAL: «si el cliente paga atrasado así sea 1 día, se le cobra un cargo de cobranza de $25.000 (se
# conserva su posición en la prelación de aplicación de pagos)». SUPUESTOS hasta la ronda 15 (R15-COBRANZA-CUOTA,
# R15-COBRANZA-REEMPLAZA, R15-COBRANZA-FIN): 25.000 por CUOTA, una sola vez, causados en el periodo en que esa cuota
# vence sin quedar completamente pagada a tiempo (pago con días de atraso, parcial o ausente; nunca por día); es cobranza
# como la de siempre (primera en la prelación, ingreso no operacional, mismo asiento) y REEMPLAZA la anterior: mientras
# este valor sea mayor que 0 no rigen umbralCocienteCobranza, cobranzaPorPeriodo (40.000) ni cobranzaDiaria (3.000) para
# la cobranza. La marca «listo para recuperación» no cambia. TEMPORAL: para volver a la cobranza anterior basta poner
# cobranzaPorCuotaAtrasada=0 (las claves anteriores siguen aquí) y subir la versión de reglas.
cobranzaPorCuotaAtrasada=25000
# D89 · BASE 360: «cambiaremos la base 365 a base 360 para el cálculo de las cuotas». SUPUESTO hasta la ronda 15
# (R15-BASE-360): tasa periódica = (1 + EA)^(días del periodo / 360) − 1 con 7, 15 o 30 días y tasa diaria
# (1 + EA)^(1/360) − 1. Quincenal y mensual no cambian (1/24 y 1/12); la semanal pasa de ^(1/52) a ^(7/360) y su cuota
# sube un poco. La diaria de 360 rige el prorrateo de la primera cuota, la mora por días y el interés del prepago por días.
# El Excel sigue en 365.
baseDiasAnio=360
