spring.application.name=motor-cartera

# Endurecimiento del API
management.endpoints.web.exposure.include=health
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=never
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
# Autenticación opcional: vacío = sin autenticación. Formato 'sha256hex:ROL,sha256hex:ROL' (CARTERA_API_CLAVES).
cartera.api.claves=${CARTERA_API_CLAVES:}
# Con true (lo fija el perfil prod) la app no arranca si cartera.api.claves está vacía.
cartera.api.claves-obligatorias=false
# Contrato OpenAPI (ConfiguracionOpenApi): solo el API v1; la documentación no pide clave.
springdoc.paths-to-match=/api/v1/**
springdoc.packages-to-scan=co.financiera.cartera.api
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
