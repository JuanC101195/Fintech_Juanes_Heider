spring.application.name=motor-cartera

# Endurecimiento del API
management.endpoints.web.exposure.include=health
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=never
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
# Autenticación opcional: vacío = sin autenticación. Formato 'sha256hex:ROL,sha256hex:ROL' (CARTERA_API_CLAVES).
cartera.api.claves=${CARTERA_API_CLAVES:}
