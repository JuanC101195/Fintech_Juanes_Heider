# Perfil de producción (SPRING_PROFILES_ACTIVE=prod). Exige CARTERA_API_CLAVES: sin clave la app no arranca.
cartera.api.claves-obligatorias=true
# Observabilidad: health, info, metrics y el endpoint de Spring Modulith (id 'applicationmodules').
# Todo salvo /actuator/health queda protegido por X-API-Key.
management.endpoints.web.exposure.include=health,info,metrics,applicationmodules
management.endpoint.health.show-details=never
# Logging estructurado JSON (formato ECS) en consola.
logging.structured.format.console=ecs
